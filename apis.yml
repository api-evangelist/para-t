aid: para-t
name: Paraşüt
description: >-
  Paraşüt is a Turkish cloud pre-accounting (ön muhasebe) and e-invoicing SaaS for
  small businesses, freelancers and accountants. Its REST API V4 exposes nearly
  everything the Paraşüt web app can do — contacts, products, inventory and
  warehouses, sales invoices and offers, purchase bills, bank and cash accounts and
  transactions, employees, salaries and taxes — plus Turkey's official electronic
  document flows (e-Fatura, e-Arşiv and e-SMM). The API follows JSON:API conventions,
  is authenticated with OAuth2, and handles e-document creation asynchronously via
  trackable jobs. Backed by 500 Global.
