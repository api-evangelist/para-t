openapi: 3.2.0
info:
  version: 4.0.0
  title: Paraşüt - API V4 E Invoices API
  x-logo:
    url: https://apidocs.parasut.com/logo.png
    backgroundColor: null
  description: '# CHANGE LOG

    ### **2021-10-11**

    #### Added

    - Belirli Firmalar İçin Özel Gereksinimler alanına Amazon için gerekli özel alanlar eklendi.'
servers:
- url: https://api.parasut.com/v4
security:
- parasut_auth: []
tags:
- name: EInvoices
  x-displayName: E-FATURA
paths:
  /{company_id}/e_invoices:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    post:
      tags:
      - EInvoices
      operationId: createEInvoice
      summary: Create
      description: ''
      responses:
        '201':
          description: Trackable Job
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TrackableJob'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - e_invoices
                    attributes:
                      $ref: '#/components/schemas/EInvoiceFormAttributes'
                    relationships:
                      type: object
                      properties:
                        invoice:
                          type: object
                          properties:
                            data:
                              type: object
                              properties:
                                id:
                                  type: string
                                  maxLength: 255
                                type:
                                  type: string
                                  maxLength: 255
                                  description: Type of the resource
                                  enum:
                                  - sales_invoices
        required: true
  /{company_id}/e_invoices/{id}:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    - name: id
      description: EInvoice ID
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - EInvoices
      operationId: showEInvoice
      summary: Show
      description: ''
      parameters:
      - name: include
        in: query
        description: 'Response ile birlikte geri dönmesini istediğiniz ilişkiler - *Available: invoice*'
        schema:
          type: string
      responses:
        '200':
          description: e-Fatura
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EInvoice'
                  included:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          maxLength: 255
                        type:
                          type: string
                          maxLength: 255
                          description: Type of the resource
                          enum:
                          - sales_invoices
                          - purchase_bills
                        attributes:
                          type: object
                        relationships:
                          type: object
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
  /{company_id}/e_invoices/{id}/pdf:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    - name: id
      description: EInvoice ID
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - EInvoices
      operationId: showEInvoicePdf
      summary: Show PDF
      description: ''
      responses:
        '200':
          description: e-Fatura PDF
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EDocumentPdf'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
    EInvoice:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - e_invoices
        attributes:
          $ref: '#/components/schemas/EInvoiceAttributes'
        relationships:
          type: object
          properties:
            invoice:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - sales_invoices
                      - purchase_bills
      required:
      - attributes
    TrackableJobAttributes:
      type: object
      properties:
        status:
          type: string
          enum:
          - running
          - done
          - error
          readOnly: true
        errors:
          type: array
          items:
            type: string
          readOnly: true
    EDocumentPdfAttributes:
      type: object
      properties:
        url:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
    EDocumentPdf:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - e_document_pdfs
        attributes:
          $ref: '#/components/schemas/EDocumentPdfAttributes'
        relationships: {}
      required:
      - attributes
    EInvoiceAttributes:
      type: object
      properties:
        external_id:
          type: string
          readOnly: true
        uuid:
          type: string
          readOnly: true
        env_uuid:
          type: string
          readOnly: true
        from_address:
          type: string
          readOnly: true
        from_vkn:
          type: string
          readOnly: true
        to_address:
          type: string
          readOnly: true
        to_vkn:
          type: string
          readOnly: true
        direction:
          type: string
          enum:
          - inbound
          - outbound
          readOnly: true
        note:
          type: string
          readOnly: true
        response_type:
          type: string
          enum:
          - accepted
          - rejected
          - refunded
          readOnly: true
        contact_name:
          type: string
          readOnly: true
        scenario:
          type: string
          enum:
          - basic
          - commercial
          readOnly: true
        status:
          type: string
          enum:
          - waiting
          - failed
          - successful
          readOnly: true
        gtb_ref_no:
          type: string
          description: GTB Referans Numarası
          readOnly: true
        gtb_registration_no:
          type: string
          description: Gümrük Çıkış Beyannamesi Tescil Numarası - *İhracat faturaları için Satış Faturası Show cevabında `active_e_document` altında gözükür.*
          readOnly: true
        gtb_export_date:
          type: string
          format: date
          description: Fiili İhracat Tarihi - *İhracat faturaları için Satış Faturası Show cevabında `active_e_document` altında gözükür.*
          readOnly: true
        response_note:
          type: string
          description: e-İhracat Red Sebebi - *İhracat faturaları için Satış Faturası Show cevabında `active_e_document` altında gözükür.*
          readOnly: true
        issue_date:
          type: string
          format: date
          readOnly: true
        is_expired:
          type: boolean
          readOnly: true
        is_answerable:
          type: boolean
          readOnly: true
        net_total:
          type: number
          readOnly: true
        currency:
          type: string
          enum:
          - TRL
          - USD
          - EUR
          - GBP
          readOnly: true
        item_type:
          type: string
          enum:
          - refund
          - invoice
          readOnly: true
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
    EDocumentCommonFormAttributes:
      type: object
      properties:
        vat_withholding_params:
          type: array
          description: 'Tevkifat kodları - *Tevkifat faturadaki her kalem için ayrıdır. Tevkifat uygulanan her ürün için Tevkifat kodu göndermeniz gerekmektedir.* - *Bu dosyada ilgili kodları bulabilirsiniz: https://ebelge.gib.gov.tr/dosyalar/kilavuzlar/UBLTR_1.2.1_Kilavuzlar.zip*'
          items:
            type: object
            properties:
              detail_id:
                type: integer
                description: Fatura kalem ID
              vat_withholding_code:
                type: string
                description: Tevkifat kodu
          readOnly: false
        vat_exemption_reason_code:
          type: string
          description: 'KDV''si %0 olan hizmet ve ürünlerin KDV muafiyet sebebi kodu. - *Bu dosyada ilgili kodları bulabilirsiniz: https://ebelge.gib.gov.tr/dosyalar/kilavuzlar/UBLTR_1.2.1_Kilavuzlar.zip*'
          readOnly: false
        vat_exemption_reason:
          type: string
          description: Eğer KDV muafiyet sebebi kodu 250 veya 350 ise KDV muafiyet sebebi açıklaması.
          readOnly: false
        excise_duty_codes:
          type: array
          description: ÖTV kodları - *Özel tüketim vergisi faturadaki her kalem için ayrıdır. ÖTV uygulanan her ürün için ÖTV kodu göndermeniz gerekmektedir.*
          items:
            type: object
            properties:
              product:
                type: integer
                description: Ürün ID
              sales_excise_duty_code:
                type: string
                description: ÖTV kodu
                enum:
                - 57
                - 59
                - 60
                - 61
                - 62
                - 63
                - 9077
          readOnly: false
    EInvoiceFormAttributes:
      allOf:
      - $ref: '#/components/schemas/EDocumentCommonFormAttributes'
      - type: object
        properties:
          scenario:
            type: string
            description: Gönderim senaryosu
            enum:
            - basic
            - commercial
          to:
            type: string
            description: Alıcının e-Fatura gelen kutusu - *[e-Fatura Gelen Kutusu Öğrenme](/#operation/listEInvoiceInboxes)*
          custom_requirement_params:
            type: object
            description: Özel gereksinimler - *[Detaylı bilgi](#section/SIK-KULLANILAN-ISLEMLER/Belirli-Firmalar-Icin-Ozel-Gereksinimler)*
            properties:
              integration:
                type: object
                properties:
                  data:
                    type: object
    TrackableJob:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - trackable_jobs
        attributes:
          $ref: '#/components/schemas/TrackableJobAttributes'
        relationships: {}
      required:
      - attributes
  securitySchemes:
    parasut_auth:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://api.parasut.com/oauth/authorize
          tokenUrl: https://api.parasut.com/oauth/token
x-tagGroups:
- name: Satışlar
  tags:
  - SalesOffers
  - SalesInvoices
  - Contacts
- name: Giderler
  tags:
