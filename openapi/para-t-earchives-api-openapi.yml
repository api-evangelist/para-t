openapi: 3.2.0
info:
  version: 4.0.0
  title: Paraşüt - API V4 E Archives API
  x-logo:
    url: https://apidocs.parasut.com/logo.png
    backgroundColor: null
  description: '# CHANGE LOG

    ### **2021-10-11**

    #### Added

    - Belirli Firmalar İçin Özel Gereksinimler alanına Amazon için gerekli özel alanlar eklendi.'
servers:
- url: https://api.parasut.com/v4
security:
- parasut_auth: []
tags:
- name: EArchives
  x-displayName: E-ARŞİV
paths:
  /{company_id}/e_archives:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    post:
      tags:
      - EArchives
      operationId: createEArchive
      summary: Create
      description: ''
      responses:
        '201':
          description: Trackable Job
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TrackableJob'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - e_archives
                    attributes:
                      $ref: '#/components/schemas/EArchiveFormAttributes'
                    relationships:
                      type: object
                      properties:
                        sales_invoice:
                          type: object
                          properties:
                            data:
                              type: object
                              properties:
                                id:
                                  type: string
                                  maxLength: 255
                                type:
                                  type: string
                                  maxLength: 255
                                  description: Type of the resource
                                  enum:
                                  - sales_invoices
        required: true
  /{company_id}/e_archives/{id}:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    - name: id
      description: EArchive ID
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - EArchives
      operationId: showEArchive
      summary: Show
      description: ''
      parameters:
      - name: include
        in: query
        description: 'Response ile birlikte geri dönmesini istediğiniz ilişkiler - *Available: sales_invoice*'
        schema:
          type: string
      responses:
        '200':
          description: e-Arşiv
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EArchive'
                  included:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          maxLength: 255
                        type:
                          type: string
                          maxLength: 255
                          description: Type of the resource
                          enum:
                          - sales_invoices
                        attributes:
                          type: object
                        relationships:
                          type: object
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
  /{company_id}/e_archives/{id}/pdf:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    - name: id
      description: EArchive ID
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - EArchives
      operationId: showEArchivePdf
      summary: Show PDF
      description: ''
      responses:
        '200':
          description: e-Arşiv PDF
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EDocumentPdf'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
components:
  schemas:
    TrackableJob:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - trackable_jobs
        attributes:
          $ref: '#/components/schemas/TrackableJobAttributes'
        relationships: {}
      required:
      - attributes
    TrackableJobAttributes:
      type: object
      properties:
        status:
          type: string
          enum:
          - running
          - done
          - error
          readOnly: true
        errors:
          type: array
          items:
            type: string
          readOnly: true
    EDocumentCommonFormAttributes:
      type: object
      properties:
        vat_withholding_params:
          type: array
          description: 'Tevkifat kodları - *Tevkifat faturadaki her kalem için ayrıdır. Tevkifat uygulanan her ürün için Tevkifat kodu göndermeniz gerekmektedir.* - *Bu dosyada ilgili kodları bulabilirsiniz: https://ebelge.gib.gov.tr/dosyalar/kilavuzlar/UBLTR_1.2.1_Kilavuzlar.zip*'
          items:
            type: object
            properties:
              detail_id:
                type: integer
                description: Fatura kalem ID
              vat_withholding_code:
                type: string
                description: Tevkifat kodu
          readOnly: false
        vat_exemption_reason_code:
          type: string
          description: 'KDV''si %0 olan hizmet ve ürünlerin KDV muafiyet sebebi kodu. - *Bu dosyada ilgili kodları bulabilirsiniz: https://ebelge.gib.gov.tr/dosyalar/kilavuzlar/UBLTR_1.2.1_Kilavuzlar.zip*'
          readOnly: false
        vat_exemption_reason:
          type: string
          description: Eğer KDV muafiyet sebebi kodu 250 veya 350 ise KDV muafiyet sebebi açıklaması.
          readOnly: false
        excise_duty_codes:
          type: array
          description: ÖTV kodları - *Özel tüketim vergisi faturadaki her kalem için ayrıdır. ÖTV uygulanan her ürün için ÖTV kodu göndermeniz gerekmektedir.*
          items:
            type: object
            properties:
              product:
                type: integer
                description: Ürün ID
              sales_excise_duty_code:
                type: string
                description: ÖTV kodu
                enum:
                - 57
                - 59
                - 60
                - 61
                - 62
                - 63
                - 9077
          readOnly: false
    Error:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
    EArchiveAttributes:
      type: object
      properties:
        uuid:
          type: string
          readOnly: true
        vkn:
          type: string
          readOnly: true
        invoice_number:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        is_printed:
          type: boolean
          readOnly: true
        status:
          type: string
          enum:
          - bounced
          - sent
          - printed
          - legalized
          readOnly: true
        printed_at:
          type: string
          format: date-time
          readOnly: true
        cancellable_until:
          type: string
          format: date-time
          readOnly: true
        is_signed:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
    EDocumentPdfAttributes:
      type: object
      properties:
        url:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
    EArchive:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - e_archives
        attributes:
          $ref: '#/components/schemas/EArchiveAttributes'
        relationships:
          type: object
          properties:
            sales_invoice:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - sales_invoices
      required:
      - attributes
    EArchiveFormAttributes:
      allOf:
      - $ref: '#/components/schemas/EDocumentCommonFormAttributes'
      - type: object
        properties:
          internet_sale:
            type: object
            description: İnternet satışı bilgileri. İnternet üzerinden bir satış yapıyorsanız doldurmak zorunlu.
            properties:
              url:
                type: string
                description: İnternet adresi
              payment_type:
                type: string
                description: Ödeme tipi
                enum:
                - KREDIKARTI/BANKAKARTI
                - EFT/HAVALE
                - KAPIDAODEME
                - ODEMEARACISI
              payment_platform:
                type: string
                description: Ödeme platformu - *(iyzico, payu gibi)*
              payment_date:
                type: string
                format: date
                pattern: YYYY-MM-DD
                description: Ödeme tarihi
          shipment:
            type: object
            description: Gönderi bilgileri. Gönderim yapılıyorsa doldurmak zorunlu. Örneğin bir hizmet satışı için kargolanan veya gönderilen birşey yoktur, bu durumda doldurulması zorunlu değil ancak bir e-ticaret sitesi olarak yapılan satışta müşteriye kargo / kurye ile bir ürün gönderimi vardır, bu durumda doldurmak zorunlu.
            properties:
              title:
                type: string
                description: Kargo şirketi adı *(Eğer kargo ile gönderiliyorsa)*
              vkn:
                type: string
                description: Kargo şirketi VKN *(Eğer kargo ile gönderiliyorsa)*
              name:
                type: string
                description: Kurye adı *(Eğer kurye ile gönderiliyorsa)*
              tckn:
                type: string
                description: Kurye TCKN *(Eğer kurye ile gönderiliyorsa)*
              date:
                type: string
                description: Gönderi tarihi
    EDocumentPdf:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - e_document_pdfs
        attributes:
          $ref: '#/components/schemas/EDocumentPdfAttributes'
        relationships: {}
      required:
      - attributes
  securitySchemes:
    parasut_auth:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://api.parasut.com/oauth/authorize
          tokenUrl: https://api.parasut.com/oauth/token
