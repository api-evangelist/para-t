components:
  schemas:
    Error:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
    WarehouseAttributes:
      type: object
      properties:
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
        name:
          type: string
          readOnly: false
          description: Depo İsmi
        address:
          type: string
          readOnly: false
          description: Adres
        city:
          type: string
          readOnly: false
          description: İl
        district:
          type: string
          readOnly: false
          description: İlçe
        is_abroad:
          type: boolean
          readOnly: false
          description: Yurt dışında
        archived:
          type: boolean
          readOnly: false
          description: Arşivlenme durumu
      required:
      - name
    ListMeta:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
    Warehouse:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - warehouses
        attributes:
          $ref: '#/components/schemas/WarehouseAttributes'
        relationships:
          type: object
          properties:
            inventory_levels:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - inventory_levels
      required:
      - attributes
  securitySchemes:
    parasut_auth:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://api.parasut.com/oauth/authorize
          tokenUrl: https://api.parasut.com/oauth/token
