                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - products
                    attributes:
                      $ref: '#/components/schemas/ProductAttributes'
                    relationships:
                      type: object
                      properties:
                        inventory_levels:
                          type: object
                          properties:
                            data:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    maxLength: 255
                                  type:
                                    type: string
                                    maxLength: 255
                                    description: Type of the resource
                                    enum:
                                    - inventory_levels
                        category:
