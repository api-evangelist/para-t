openapi: 3.2.0
info:
  version: 4.0.0
  title: Paraşüt - API V4 Products API
  x-logo:
    url: https://apidocs.parasut.com/logo.png
    backgroundColor: null
  description: '# CHANGE LOG

    ### **2021-10-11**

    #### Added

    - Belirli Firmalar İçin Özel Gereksinimler alanına Amazon için gerekli özel alanlar eklendi.'
servers:
- url: https://api.parasut.com/v4
security:
- parasut_auth: []
tags:
- name: Products
  x-displayName: ÜRÜN
paths:
  /{company_id}/products:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - Products
      operationId: listProducts
      summary: Index
      description: ''
      parameters:
      - name: filter[name]
        in: query
        description: ''
        schema:
          type: string
      - name: filter[code]
        in: query
        description: ''
        schema:
          type: string
      - name: sort
        in: query
        description: 'Sortable parameters - *Available: id, name*'
        schema:
          type: string
          default: -id
      - name: page[number]
        in: query
        description: Page Number
        schema:
          type: integer
          default: 1
      - name: page[size]
        in: query
        description: Page Size
        schema:
          type: integer
          default: 15
          maximum: 25
          minimum: 1
      - name: include
        in: query
        description: 'Response ile birlikte geri dönmesini istediğiniz ilişkiler - *Available: inventory_levels, category*'
        schema:
          type: string
      responses:
        '200':
          description: Ürünler
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  included:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          maxLength: 255
                        type:
                          type: string
                          maxLength: 255
                          description: Type of the resource
                          enum:
                          - inventory_levels
                          - item_categories
                        attributes:
                          type: object
                        relationships:
                          type: object
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
    post:
      tags:
      - Products
      operationId: createProduct
      summary: Create
      description: ''
      parameters:
      - name: include
