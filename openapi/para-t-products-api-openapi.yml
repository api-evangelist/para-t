components:
  schemas:
    Error:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
    ListMeta:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
    Product:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - products
        attributes:
          $ref: '#/components/schemas/ProductAttributes'
        relationships:
          type: object
          properties:
            inventory_levels:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - inventory_levels
            category:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - item_categories
      required:
      - attributes
    ProductAttributes:
      type: object
      properties:
        sales_excise_duty_code:
          type: string
          readOnly: true
        sales_invoice_details_count:
          type: integer
          readOnly: true
        purchase_invoice_details_count:
          type: integer
          readOnly: true
        list_price_in_trl:
          type: number
          readOnly: true
        buying_price_in_trl:
          type: number
          readOnly: true
        stock_count:
          type: number
          readOnly: true
          description: Stok Miktarı
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
        code:
          type: string
          readOnly: false
          description: Ürün/hizmet kodu
        name:
          type: string
          readOnly: false
          description: Ürün/hizmet ismi
        vat_rate:
          type: number
          readOnly: false
          description: KDV oranı
        sales_excise_duty:
          type: number
          readOnly: false
          description: Satış ÖTV
        sales_excise_duty_type:
          type: string
          readOnly: false
          description: Satış ÖTV tipi
        purchase_excise_duty:
          type: number
          readOnly: false
          description: Alış ÖTV
        purchase_excise_duty_type:
          type: string
          readOnly: false
          description: Alış ÖTV tipi
        unit:
          type: string
          readOnly: false
          description: Birim
        communications_tax_rate:
          type: number
          readOnly: false
          description: ÖİV oranı
        archived:
          type: boolean
          readOnly: false
        list_price:
          type: number
          readOnly: false
          description: Satış fiyatı
        currency:
          type: string
          readOnly: false
          description: Satış döviz
        buying_price:
          type: number
          readOnly: false
          description: Alış fiyatı
        buying_currency:
          type: string
          readOnly: false
          description: Alış döviz
        inventory_tracking:
          type: boolean
          readOnly: false
        initial_stock_count:
          type: number
          readOnly: false
          description: Başlangıç Stok Miktarı. Birden fazla deponuz varsa başlangıç stok miktarını, depo stok seviyesi (inventory_level) relationship'i üzerinden depo bazında göndermelisiniz.
        gtip:
          type: string
          format: number
          description: Ürünün GTIP kodu - *https://uygulama.gtb.gov.tr/Tara adresinden öğrenebilirsiniz*
          readOnly: false
        barcode:
          type: string
          readOnly: false
      required:
      - name
  securitySchemes:
    parasut_auth:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://api.parasut.com/oauth/authorize
          tokenUrl: https://api.parasut.com/oauth/token
