openapi: 3.2.0
info:
  version: 4.0.0
  title: Paraşüt - API V4 Transactions API
  x-logo:
    url: https://apidocs.parasut.com/logo.png
    backgroundColor: null
  description: '# CHANGE LOG

    ### **2021-10-11**

    #### Added

    - Belirli Firmalar İçin Özel Gereksinimler alanına Amazon için gerekli özel alanlar eklendi.'
servers:
- url: https://api.parasut.com/v4
security:
- parasut_auth: []
tags:
- name: Transactions
  x-displayName: İŞLEM
paths:
  /{company_id}/transactions/{id}:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    - name: id
      description: İşlem ID
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - Transactions
      operationId: showTransaction
      summary: Show
      description: ''
      parameters:
      - name: include
        in: query
        description: 'Response ile birlikte geri dönmesini istediğiniz ilişkiler - *Available: debit_account, credit_account, payments*'
        schema:
          type: string
      responses:
        '200':
          description: İşlem
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Transaction'
                  included:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          maxLength: 255
                        type:
                          type: string
                          maxLength: 255
                          description: Type of the resource
                          enum:
                          - accounts
                          - payments
                        attributes:
                          type: object
                        relationships:
                          type: object
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Transactions
      operationId: deleteTransaction
      summary: Delete
      description: ''
      responses:
        '204':
          description: No content
          content:
            application/vnd.api+json:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
components:
  schemas:
    Transaction:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - transactions
        attributes:
          $ref: '#/components/schemas/TransactionAttributes'
        relationships:
          type: object
          properties:
            debit_account:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - accounts
            credit_account:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - accounts
            payments:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        maxLength: 255
                      type:
                        type: string
                        maxLength: 255
                        description: Type of the resource
                        enum:
                        - payments
      required:
      - attributes
    TransactionAttributes:
      type: object
      properties:
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
        description:
          type: string
          readOnly: false
          description: Açıklama
        transaction_type:
          type: string
          readOnly: false
          description: İşlem türü
        date:
          type: string
          format: date
          readOnly: false
          description: Tarih
        amount_in_trl:
          type: number
          readOnly: false
          description: TRL karşılığı meblağ
        debit_amount:
          type: number
          readOnly: false
          description: Borç meblağ
        debit_currency:
          type: string
          enum:
          - TRL
          - USD
          - EUR
          - GBP
          readOnly: false
          description: Borç döviz cinsi
        credit_amount:
          type: number
          readOnly: false
          description: Alacak meblağ
        credit_currency:
          type: string
          enum:
          - TRL
          - USD
          - EUR
          - GBP
          readOnly: false
          description: Alacak döviz cinsi
    Error:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
  securitySchemes:
    parasut_auth:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://api.parasut.com/oauth/authorize
          tokenUrl: https://api.parasut.com/oauth/token
