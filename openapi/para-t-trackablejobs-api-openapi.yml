openapi: 3.2.0
info:
  version: 4.0.0
  title: Paraşüt - API V4 Trackable Jobs API
  x-logo:
    url: https://apidocs.parasut.com/logo.png
    backgroundColor: null
  description: '# CHANGE LOG

    ### **2021-10-11**

    #### Added

    - Belirli Firmalar İçin Özel Gereksinimler alanına Amazon için gerekli özel alanlar eklendi.'
servers:
- url: https://api.parasut.com/v4
security:
- parasut_auth: []
tags:
- name: TrackableJobs
  x-displayName: TRACKABLE JOB
paths:
  /{company_id}/trackable_jobs/{id}:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    - name: id
      description: Trackable Job ID
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - TrackableJobs
      operationId: showTrackableJob
      summary: Show
      description: ''
      responses:
        '200':
          description: Trackable Job
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TrackableJob'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
components:
  schemas:
    TrackableJobAttributes:
      type: object
      properties:
        status:
          type: string
          enum:
          - running
          - done
          - error
          readOnly: true
        errors:
          type: array
          items:
            type: string
          readOnly: true
    TrackableJob:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - trackable_jobs
        attributes:
          $ref: '#/components/schemas/TrackableJobAttributes'
        relationships: {}
      required:
      - attributes
    Error:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
  securitySchemes:
    parasut_auth:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://api.parasut.com/oauth/authorize
          tokenUrl: https://api.parasut.com/oauth/token
