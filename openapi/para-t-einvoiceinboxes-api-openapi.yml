    - Belirli Firmalar İçin Özel Gereksinimler alanına Amazon için gerekli özel alanlar eklendi.'
servers:
- url: https://api.parasut.com/v4
security:
- parasut_auth: []
tags:
- name: EInvoiceInboxes
  x-displayName: E-FATURA GELEN KUTUSU
paths:
  /{company_id}/e_invoice_inboxes:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - EInvoiceInboxes
      operationId: listEInvoiceInboxes
      summary: Index
      description: ''
      parameters:
      - name: filter[vkn]
        in: query
        description: ''
        schema:
          type: integer
      - name: page[number]
        in: query
        description: Page Number
        schema:
          type: integer
          default: 1
      - name: page[size]
        in: query
        description: Page Size
        schema:
          type: integer
          default: 15
          maximum: 25
          minimum: 1
      responses:
        '200':
          description: E-fatura posta kutuları
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EInvoiceInbox'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
components:
  schemas:
    ListMeta:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
    EInvoiceInboxAttributes:
      type: object
      properties:
        vkn:
          type: string
          readOnly: true
        e_invoice_address:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        inbox_type:
          type: string
          readOnly: true
        address_registered_at:
          type: string
          format: date-time
          readOnly: true
        registered_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
    Error:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
    EInvoiceInbox:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - e_invoice_inboxes
        attributes:
          $ref: '#/components/schemas/EInvoiceInboxAttributes'
        relationships: {}
      required:
      - attributes
  securitySchemes:
    parasut_auth:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://api.parasut.com/oauth/authorize
          tokenUrl: https://api.parasut.com/oauth/token
