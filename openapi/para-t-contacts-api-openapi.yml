components:
  schemas:
    ContactAttributes:
      type: object
      properties:
        balance:
          type: number
          readOnly: true
          description: Bakiye
        trl_balance:
          type: number
          readOnly: true
          description: TL Bakiye
        usd_balance:
          type: number
          readOnly: true
          description: USD Bakiye
        eur_balance:
          type: number
          readOnly: true
          description: EUR Bakiye
        gbp_balance:
          type: number
          readOnly: true
          description: GBP Bakiye
        created_at:
          type: string
          format: date
          readOnly: true
          description: Kayıt tarihi
        updated_at:
          type: string
          format: date
          readOnly: true
          description: Son güncelleme tarihi
        email:
          type: string
          format: email
          readOnly: false
          description: E-posta
        name:
          type: string
          readOnly: false
          description: Müşteri/tedarikçi ismi
        short_name:
          type: string
          readOnly: false
        contact_type:
          type: string
          enum:
          - person
          - company
          readOnly: false
          description: Tip
        tax_office:
          type: string
          readOnly: false
          description: Vergi dairesi
        tax_number:
          type: string
          readOnly: false
          description: Vergi numarası/TC kimlik no
        district:
          type: string
          readOnly: false
          description: İlçe
        postal_code:
          type: string
          readOnly: false
          description: Posta kodu
        city:
          type: string
          readOnly: false
          description: İl
        country:
          type: string
          readOnly: false
        address:
          type: string
          readOnly: false
        phone:
          type: string
          readOnly: false
        fax:
          type: string
          readOnly: false
        is_abroad:
          type: boolean
          readOnly: false
          description: Müşteri/tedarikçi yurt dışı bilgisi
        archived:
          type: boolean
          readOnly: false
        iban:
          type: string
          readOnly: false
        account_type:
          type: string
          enum:
          - customer
          - supplier
          readOnly: false
        untrackable:
          type: boolean
          readOnly: false
          description: Listelenmemiş müşteri sonradan listelenebilir hale getirilemez
        invoicing_preferences:
          type: object
          properties:
            e_document_accounts:
              description: Bu alana hesap ID'leri eklenebilir.
              type: array
              items:
                type: integer
          readOnly: false
      required:
      - name
      - account_type
    TransactionAttributes:
      type: object
      properties:
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
        description:
          type: string
          readOnly: false
          description: Açıklama
        transaction_type:
          type: string
          readOnly: false
          description: İşlem türü
        date:
          type: string
          format: date
          readOnly: false
          description: Tarih
        amount_in_trl:
          type: number
          readOnly: false
          description: TRL karşılığı meblağ
        debit_amount:
          type: number
          readOnly: false
          description: Borç meblağ
        debit_currency:
          type: string
          enum:
          - TRL
          - USD
          - EUR
          - GBP
          readOnly: false
          description: Borç döviz cinsi
        credit_amount:
          type: number
          readOnly: false
          description: Alacak meblağ
        credit_currency:
          type: string
          enum:
          - TRL
          - USD
          - EUR
          - GBP
          readOnly: false
          description: Alacak döviz cinsi
    ListMeta:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
    ContactPaymentFormAttributes:
      allOf:
      - $ref: '#/components/schemas/PaymentFormAttributes'
      - type: object
        properties:
          payable_ids:
            description: Alış Faturası ID'leri - *Ödemenizin öncelikli olarak eşleşmesini istediğiniz faturalar*
            type: array
            items:
              type: integer
    ContactCollectionFormAttributes:
      allOf:
      - $ref: '#/components/schemas/PaymentFormAttributes'
      - type: object
