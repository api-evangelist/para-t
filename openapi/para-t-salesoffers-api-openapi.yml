                          description: Online ödeme hatırlatıcı
                          default: false
                        has_referral_link:
                          type: boolean
                          description: Referans linki
                          default: false
                    properties:
                      type: object
                relationships:
                  type: object
                  properties:
                    shareable:
                      type: object
                      properties:
                        data:
                          type: object
                          properties:
