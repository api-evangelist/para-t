      summary: e-mail
      description: 'E-mail status erişimi aşağıdaki şekilde sağlanır:


        Öncelikle, mevcut teklife bir GET isteği gönderilir. Ardından, yanıtta bulunan ''included'' içinde ''sharings'' türünde bir obje bulunur. Bu obje açılarak içindeki ''attributes'' alanına bakılır. ''email_status'' alanı, şu anda e-postanın durumunu sağlayacaktır.'
