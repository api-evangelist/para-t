openapi: 3.2.0
info:
  version: 4.0.0
  title: Paraşüt - API V4 Stock Movements API
  x-logo:
    url: https://apidocs.parasut.com/logo.png
    backgroundColor: null
  description: '# CHANGE LOG

    ### **2021-10-11**

    #### Added

    - Belirli Firmalar İçin Özel Gereksinimler alanına Amazon için gerekli özel alanlar eklendi.'
servers:
- url: https://api.parasut.com/v4
security:
- parasut_auth: []
tags:
- name: StockMovements
  x-displayName: STOK HAREKETİ
paths:
  /{company_id}/stock_movements:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - StockMovements
      operationId: listStockMovements
      summary: Index
      description: Tüm stok hareketlerini listeler. Her irsaliye oluşturulurken stok hareketi de oluşturulur. Buna ilave olarak, irsaliyeli satış faturası veya irsaliyeli alış faturası oluşturulduğunda stok takibi yapılan bir ürün içeren her fatura kalemine karşılık otomatik olarak bir stok hareketi oluşur.
      parameters:
      - name: sort
        in: query
        description: 'Sortable parameters - *Available: id, date*'
        schema:
          type: string
          default: id
      - name: page[number]
        in: query
        description: Page Number
        schema:
          type: integer
          default: 1
      - name: page[size]
        in: query
        description: Page Size
        schema:
          type: integer
          default: 15
          maximum: 25
          minimum: 1
      - name: include
        in: query
        description: 'Response ile birlikte geri dönmesini istediğiniz ilişkiler - *Available: product, source, contact, warehouse*'
        schema:
          type: string
      responses:
        '200':
          description: Stok hareketleri
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockMovement'
                  included:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          maxLength: 255
                        type:
                          type: string
                          maxLength: 255
                          description: Type of the resource
                          enum:
                          - warehouses
                          - products
                          - shipment_documents
                          - sales_invoice_details
                          - purchase_bill_details
                          - contacts
                        attributes:
                          type: object
                        relationships:
                          type: object
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
components:
  schemas:
    StockMovementAttributes:
      type: object
      properties:
        detail_no:
          type: number
          readOnly: true
          description: Detay sıra no
        date:
          type: string
          format: date
          readOnly: true
          description: Hareket tarihi
        created_at:
          type: string
          format: date
          readOnly: true
          description: Kayıt tarihi
        updated_at:
          type: string
          format: date
          readOnly: true
          description: Son güncelleme tarihi
        quantity:
          type: number
          readOnly: false
          description: Miktar
      required:
      - quantity
    Error:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
    ListMeta:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
    StockMovement:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - stock_movements
        attributes:
          $ref: '#/components/schemas/StockMovementAttributes'
        relationships:
          type: object
          properties:
            warehouse:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - warehouses
            product:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - products
            source:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - shipment_documents
                      - sales_invoice_details
                      - purchase_bill_details
            contact:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - contacts
      required:
      - attributes
  securitySchemes:
    parasut_auth:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://api.parasut.com/oauth/authorize
          tokenUrl: https://api.parasut.com/oauth/token
