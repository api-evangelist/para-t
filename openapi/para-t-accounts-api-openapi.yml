components:
  schemas:
    AccountDebitCreditTransactionFormAttributes:
      type: object
      properties:
        date:
          type: string
          format: date
          description: İşlem Tarihi
          readOnly: false
        amount:
          type: number
          description: İşlem Tutarı
          readOnly: false
        description:
          type: string
          description: İşlem Açıklaması
          readOnly: false
      required:
      - date
      - amount
    Account:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - accounts
        attributes:
          $ref: '#/components/schemas/AccountAttributes'
        relationships: {}
      required:
      - attributes
    TransactionAttributes:
      type: object
      properties:
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
        description:
          type: string
          readOnly: false
          description: Açıklama
        transaction_type:
          type: string
          readOnly: false
          description: İşlem türü
        date:
          type: string
          format: date
          readOnly: false
          description: Tarih
        amount_in_trl:
          type: number
          readOnly: false
          description: TRL karşılığı meblağ
        debit_amount:
          type: number
          readOnly: false
          description: Borç meblağ
        debit_currency:
          type: string
          enum:
          - TRL
          - USD
          - EUR
          - GBP
          readOnly: false
          description: Borç döviz cinsi
        credit_amount:
          type: number
          readOnly: false
          description: Alacak meblağ
        credit_currency:
          type: string
          enum:
          - TRL
          - USD
          - EUR
          - GBP
          readOnly: false
          description: Alacak döviz cinsi
    ListMeta:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
    AccountAttributes:
      type: object
      properties:
        used_for:
          type: string
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
        balance:
          type: number
          readOnly: true
          description: Bakiye
        last_adjustment_date:
          type: string
          format: date-time
          readOnly: true
        bank_integration_type:
          type: string
          readOnly: true
        associate_email:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
        name:
          type: string
          readOnly: false
          description: Hesap ismi
        currency:
          type: string
          enum:
          - TRL
          - USD
          - EUR
          - GBP
          readOnly: false
          description: Döviz cinsi
        account_type:
          type: string
          enum:
          - cash
          - bank
          - sys
          readOnly: false
          description: Hesap tipi
        bank_name:
          type: string
          readOnly: false
          description: Banka ismi
        bank_branch:
          type: string
          readOnly: false
          description: Banka şubesi
        bank_account_no:
          type: string
          readOnly: false
          description: Banka hesap no
        iban:
          type: string
          readOnly: false
          description: IBAN
        archived:
          type: boolean
          readOnly: false
      required:
