openapi: 3.2.0
info:
  version: 4.0.0
  title: Paraşüt - API V4 Inventory Levels API
  x-logo:
    url: https://apidocs.parasut.com/logo.png
    backgroundColor: null
  description: '# CHANGE LOG

    ### **2021-10-11**

    #### Added

    - Belirli Firmalar İçin Özel Gereksinimler alanına Amazon için gerekli özel alanlar eklendi.'
servers:
- url: https://api.parasut.com/v4
security:
- parasut_auth: []
tags:
- name: Inventory Levels
  x-displayName: DEPO STOK SEVİYESİ
paths:
  /{company_id}/product/{product_id}/inventory_levels:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    - name: product_id
      description: Ürün ID
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - Inventory Levels
      operationId: listInventoryLevels
      summary: Index
      description: Ürünün varolan depolardaki tüm stok seviyelerini listeler.
      parameters:
      - name: filter[warehouses.name]
        in: query
        description: Sonuçların filtrelenmesini istediğiniz depo ismi.
        schema:
          type: string
      - name: filter[archived]
        in: query
        description: ''
        schema:
          type: boolean
      - name: filter[has_stock]
        in: query
        description: ''
        schema:
          type: boolean
      - name: filter[stock_count]
        in: query
        description: ''
        schema:
          type: number
      - name: sort
        in: query
        description: 'Sortable parameters - *Available: id, stock_count*'
        schema:
          type: string
          default: id
      - name: page[number]
        in: query
        description: Page Number
        schema:
          type: integer
          default: 1
      - name: page[size]
        in: query
        description: Page Size
        schema:
          type: integer
          default: 15
          maximum: 25
          minimum: 1
      - name: include
        in: query
        description: 'Response ile birlikte geri dönmesini istediğiniz ilişkiler - *Available: product, warehouse*'
        schema:
          type: string
      responses:
        '200':
          description: Depo stok seviyeleri
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryLevel'
                  included:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          maxLength: 255
                        type:
                          type: string
                          maxLength: 255
                          description: Type of the resource
                          enum:
                          - products
                          - warehouses
                        attributes:
                          type: object
                        relationships:
                          type: object
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
    ListMeta:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
    InventoryLevelAttributes:
      type: object
      properties:
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
        stock_count:
          type: number
          readOnly: true
          description: Stok Miktarı
        initial_stock_count:
          type: number
          readOnly: false
          description: Başlangıç Stok Miktarı
        critical_stock_count:
          type: number
          readOnly: false
    InventoryLevel:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - inventory_levels
        attributes:
          $ref: '#/components/schemas/InventoryLevelAttributes'
        relationships:
          type: object
          properties:
            product:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - products
            warehouse:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - warehouses
      required:
      - attributes
  securitySchemes:
    parasut_auth:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://api.parasut.com/oauth/authorize
          tokenUrl: https://api.parasut.com/oauth/token
