components:
  schemas:
    Error:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
    EmployeeAttributes:
      type: object
      properties:
        balance:
          type: number
          readOnly: true
          description: Bakiye
        trl_balance:
          type: number
          readOnly: true
        usd_balance:
          type: number
          readOnly: true
        eur_balance:
          type: number
          readOnly: true
        gbp_balance:
          type: number
          readOnly: true
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
        name:
          type: string
          readOnly: false
          description: Çalışan adı soyadı
        email:
          type: string
          format: email
          readOnly: false
        archived:
          type: boolean
          readOnly: false
        iban:
          type: string
          readOnly: false
      required:
      - name
    Employee:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - employees
        attributes:
          $ref: '#/components/schemas/EmployeeAttributes'
        relationships:
          type: object
          properties:
            category:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - item_categories
            managed_by_user:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - users
            managed_by_user_role:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - user_roles
      required:
      - attributes
    ListMeta:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
  securitySchemes:
    parasut_auth:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://api.parasut.com/oauth/authorize
          tokenUrl: https://api.parasut.com/oauth/token
