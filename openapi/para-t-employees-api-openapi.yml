  /{company_id}/employees:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - Employees
      operationId: listEmployees
      summary: Index
      description: ''
      parameters:
      - name: filter[name]
        in: query
        description: ''
        schema:
          type: string
      - name: filter[email]
        in: query
        description: ''
        schema:
          type: string
      - name: sort
        in: query
        description: 'Sortable parameters - *Available: id, balance, name, email*'
        schema:
          type: string
          default: -balance
      - name: page[number]
        in: query
        description: Page Number
        schema:
          type: integer
          default: 1
      - name: page[size]
        in: query
        description: Page Size
        schema:
          type: integer
          default: 15
          maximum: 25
          minimum: 1
      - name: include
        in: query
        description: 'Response ile birlikte geri dönmesini istediğiniz ilişkiler - *Available: category, managed_by_user, managed_by_user_role*'
        schema:
          type: string
      responses:
        '200':
          description: Çalışanlar
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Employee'
                  included:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          maxLength: 255
                        type:
                          type: string
                          maxLength: 255
                          description: Type of the resource
                          enum:
                          - item_categories
                          - users
                          - user_roles
                        attributes:
                          type: object
                        relationships:
                          type: object
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
