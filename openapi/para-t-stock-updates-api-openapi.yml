openapi: 3.2.0
info:
  version: 4.0.0
  title: Paraşüt - API V4 Stock Updates API
  x-logo:
    url: https://apidocs.parasut.com/logo.png
    backgroundColor: null
  description: '# CHANGE LOG

    ### **2021-10-11**

    #### Added

    - Belirli Firmalar İçin Özel Gereksinimler alanına Amazon için gerekli özel alanlar eklendi.'
servers:
- url: https://api.parasut.com/v4
security:
- parasut_auth: []
tags:
- name: Stock Updates
  x-displayName: STOK GÜNCELLEME
paths:
  /{company_id}/stock_updates:
    parameters:
    - name: company_id
      description: Firma ID
      in: path
      required: true
      schema:
        type: integer
    post:
      tags:
      - Stock Updates
      operationId: createStockUpdate
      summary: Create
      description: ''
      parameters:
      - name: include
        in: query
        description: 'Response ile birlikte geri dönmesini istediğiniz ilişkiler - *Available: details, details.product, details.warehouse*'
        schema:
          type: string
      responses:
        '201':
          description: Stok güncelleme
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StockUpdate'
                  included:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          maxLength: 255
                        type:
                          type: string
                          maxLength: 255
                          description: Type of the resource
                          enum:
                          - stock_update_details
                        attributes:
                          type: object
                        relationships:
                          type: object
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - stock_updates
                    attributes:
                      $ref: '#/components/schemas/StockUpdateAttributes'
                    relationships:
                      type: object
                      properties:
                        details:
                          type: object
                          properties:
                            data:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    maxLength: 255
                                  type:
                                    type: string
                                    maxLength: 255
                                    description: Type of the resource
                                    enum:
                                    - stock_update_details
                                  attributes:
                                    $ref: '#/components/schemas/StockUpdateDetailAttributes'
                                  relationships:
                                    type: object
                                    properties:
                                      product:
                                        type: object
                                        properties:
                                          data:
                                            type: object
                                            properties:
                                              id:
                                                type: string
                                                maxLength: 255
                                              type:
                                                type: string
                                                maxLength: 255
                                                description: Type of the resource
                                                enum:
                                                - products
                                      warehouse:
                                        type: object
                                        properties:
                                          data:
                                            type: object
                                            properties:
                                              id:
                                                type: string
                                                maxLength: 255
                                              type:
                                                type: string
                                                maxLength: 255
                                                description: Type of the resource
                                                enum:
                                                - warehouses
        required: true
components:
  schemas:
    StockUpdateDetailAttributes:
      type: object
      properties:
        old_total_inventory:
          type: number
          required: true
          readOnly: true
          description: Eski stok miktarı
        created_at:
          type: string
          format: date
          readOnly: true
          description: Kayıt tarihi
        updated_at:
          type: string
          format: date
          readOnly: true
          description: Son güncelleme tarihi
        new_total_inventory:
          type: number
          readOnly: false
          description: Yeni stok miktarı
      required:
      - new_total_inventory
    Error:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
    StockUpdateAttributes:
      type: object
      properties:
        created_at:
          type: string
          format: date
          readOnly: true
          description: Stok güncelleme tarihi
        updated_at:
          type: string
          format: date
          readOnly: true
          description: Son güncelleme tarihi
    StockUpdate:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - stock_updates
        attributes:
          $ref: '#/components/schemas/StockUpdateAttributes'
        relationships:
          type: object
          properties:
            details:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        maxLength: 255
                      type:
                        type: string
                        maxLength: 255
                        description: Type of the resource
                        enum:
                        - stock_update_details
      required:
      - attributes
  securitySchemes:
    parasut_auth:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://api.parasut.com/oauth/authorize
          tokenUrl: https://api.parasut.com/oauth/token
