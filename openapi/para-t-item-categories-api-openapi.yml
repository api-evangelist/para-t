components:
  schemas:
    ItemCategoryAttributes:
      type: object
      properties:
        full_path:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
        name:
          type: string
          readOnly: false
          description: Kategori adı
        bg_color:
          type: string
          readOnly: false
          description: Renk
        text_color:
          type: string
          readOnly: false
          description: Yazı rengi
        category_type:
          type: string
          enum:
          - Product
          - Contact
          - Employee
          - SalesInvoice
          - Expenditure
          readOnly: false
          description: Kategori tipi
        parent_id:
          type: integer
          readOnly: false
      required:
      - name
      - category_type
    Error:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
    ListMeta:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
    ItemCategory:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - item_categories
        attributes:
          $ref: '#/components/schemas/ItemCategoryAttributes'
        relationships:
          type: object
          properties:
            parent_category:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - item_categories
            subcategories:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        maxLength: 255
                      type:
                        type: string
                        maxLength: 255
                        description: Type of the resource
                        enum:
                        - item_categories
      required:
      - attributes
  securitySchemes:
    parasut_auth:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://api.parasut.com/oauth/authorize
          tokenUrl: https://api.parasut.com/oauth/token
