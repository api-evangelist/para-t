components:
  schemas:
    BankFee:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - bank_fees
        attributes:
          $ref: '#/components/schemas/BankFeeAttributes'
        relationships:
          type: object
          properties:
            category:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - item_categories
            tags:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        maxLength: 255
                      type:
                        type: string
                        maxLength: 255
                        description: Type of the resource
                        enum:
                        - tags
      required:
      - attributes
    BankFeeAttributes:
      type: object
      properties:
        total_paid:
          type: number
          readOnly: true
        archived:
          type: boolean
          readOnly: true
        remaining:
          type: number
          readOnly: true
        remaining_in_trl:
          type: number
          readOnly: true
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
        description:
          type: string
          readOnly: false
        currency:
          type: string
          enum:
          - TRL
          - USD
          - EUR
          - GBP
          readOnly: false
        issue_date:
          type: string
          format: date
          readOnly: false
        due_date:
          type: string
          format: date
          readOnly: false
        exchange_rate:
          type: number
          readOnly: false
        net_total:
          type: number
          readOnly: false
      required:
      - description
      - currency
      - issue_date
      - due_date
      - net_total
    PaymentFormAttributes:
      type: object
      properties:
        description:
          type: string
          description: Ödeme/Tahsilat Açıklaması
          readOnly: false
        account_id:
          type: integer
          description: Kasa veya Banka - *Bu parametre ayrıca ödemenin/tahsilatın hangi döviz kuru ile yapılacağını belirler.*
          readOnly: false
        date:
          type: string
          format: date
          description: Ödeme/Tahsilat tarihi
          readOnly: false
        amount:
          type: number
          description: Ödeme/Tahsilat tutarı
          readOnly: false
        exchange_rate:
          type: number
          description: Döviz kuru - *Eğer ödeme/tahsilat, faturadan farklı bir döviz kuru ile yapılacaksa; döviz kurunun TL karşılığını belirtin. Eğer ödeme/tahsilat, fatura ile aynı döviz kuru ile yapılacaksa; "1.0" değerini girin veya boş bırakın.*
          readOnly: false
    PaymentAttributes:
      type: object
      properties:
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
        date:
          type: string
          format: date
          description: Ödeme tarihi
          readOnly: false
        amount:
          type: number
          description: Ödeme tutarı
          readOnly: false
        currency:
          type: number
          description: Para birimi
          readOnly: false
        notes:
          type: string
          readOnly: false
    Error:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
    Payment:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          description: Type of the resource
          enum:
          - payments
        attributes:
          $ref: '#/components/schemas/PaymentAttributes'
        relationships:
          type: object
          properties:
            payable:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - sales_invoices
                      - purchase_bills
                      - taxes
                      - bank_fees
                      - salaries
                      - checks
            transaction:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    type:
                      type: string
                      maxLength: 255
                      description: Type of the resource
                      enum:
                      - transactions
      required:
      - attributes
